name: Saarthi CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  type-check:
    name: 🔍 TypeScript & Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript types
        run: npx tsc --noEmit

  build:
    name: 🚀 Production Build Verification
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
          CLERK_SECRET_KEY: "sk_test_ci_placeholder"
          NEXT_PUBLIC_NEON_DB_CONNECTION_STRING: "postgresql://user:pass@localhost:5432/db"
          GROQ_API_KEY: "gsk_ci_placeholder"
          MY_AWS_REGION: "us-east-1"
          MY_AWS_ACCESS_KEY_ID: "AKIA_CI_PLACEHOLDER"
          MY_AWS_SECRET_ACCESS_KEY: "ci_placeholder_secret"
        run: npm run build

  docker-build:
    name: 🐳 Docker Image Build Verification
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: saarthi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
